<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Marcellus&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
  /* Stessa identità del sito: giallo del logo, nero, Playfair per i titoli, Marcellus per le maiuscole. */
  :root {
    --bg: #fffdf6; --card: #fff; --ink: #1b1a17; --muted: #5f584a; --line: #ece2bd;
    --giallo: #ffef96; --giallo-chiaro: #fff8d4; --nero: #111214; --err: #a3412a; --ok: #2e6f46; --radius: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font: 600 2.1rem/1.15 "Playfair Display", Georgia, serif; margin: 0 0 .4em; text-wrap: balance; }
  h2 { font: 600 1.35rem/1.3 "Playfair Display", Georgia, serif; margin: 1.6em 0 .6em; }
  a { color: var(--ink); text-underline-offset: 3px; }
  :focus-visible { outline: 3px solid var(--nero); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }
  .eyebrow { font-family: Marcellus, Optima, sans-serif; text-transform: uppercase; letter-spacing: .1em; font-size: .8rem; margin: 0 0 6px; }
  .clausola { border-left: 6px solid var(--nero); background: var(--giallo); padding: 12px 16px; border-radius: 8px; margin: 16px 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  fieldset { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); padding: 16px 18px; margin: 0 0 16px; }
  legend { font-weight: 700; padding: 0 6px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  label.opt { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin: 6px 0; }
  label.opt input { margin-top: 4px; }
  input[type=text], input[type=email], input[type=tel], input[type=date], select, textarea {
    width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
  }
  textarea { min-height: 80px; }
  .griglia { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .scelte { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 16px; }
  @media (max-width: 560px) { .griglia { grid-template-columns: 1fr; } }
  .zona { margin-top: 10px; }
  .zona-titolo { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  button, .btn {
    display: inline-block; font: inherit; font-weight: 700; padding: 12px 22px; border-radius: 999px;
    border: 2px solid var(--nero); background: var(--nero); color: var(--giallo); cursor: pointer; text-decoration: none;
  }
  button.ghost { background: transparent; color: var(--nero); padding: 4px 12px; font-size: .85rem; }
  button[disabled] { opacity: .6; cursor: wait; }
  .errori { color: var(--err); background: #fbe9e4; border-radius: 10px; padding: 10px 16px; }
  .errori ul { margin: 0; padding-left: 18px; }
  .esito-ok { color: var(--ok); background: #e3f3e7; border-radius: 10px; padding: 14px 18px; }
  .hp { position: absolute; left: -5000px; }
  .tag { display: inline-block; background: var(--giallo); color: var(--ink); border-radius: 999px; padding: 2px 10px; font-size: .8rem; margin: 2px 4px 2px 0; }
  .contatti a { font-weight: 700; margin-right: 14px; }
  .testata { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .testata img { width: 56px; height: 56px; }
  .testata .eyebrow { margin: 0; }
  footer { margin-top: 40px; font-size: .85rem; color: var(--muted); }
</style>
