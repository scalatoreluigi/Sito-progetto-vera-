# Pannello di gestione del sito. Si apre su https://progettoveraeisuoiamici.it/admin/
site_url: https://progettoveraeisuoiamici.it
logo_url: /images/logo-192.png
backend:
  name: github
  repo: scalatoreluigi/Sito-progetto-vera-
  branch: main

media_folder: images/uploads
public_folder: /images/uploads
locale: it

collections:
  - name: sito
    label: Contenuti del sito
    editor: { preview: false }
    files:
      - name: raccolta
        label: "⚡ Raccolta in corso (aggiornamento rapido)"
        file: content/raccolta.json
        fields:
          - { name: raccolto, label: "Raccolto finora (€)", widget: number, value_type: float, min: 0 }
          - { name: aggiornato_il, label: "Aggiornato il (dopo 30 giorni senza aggiornamenti la barra sparisce dal sito)", widget: datetime, format: "YYYY-MM-DD", time_format: false }
          - { name: obiettivo, label: "Obiettivo (€)", widget: number, value_type: float, min: 1 }
          - { name: esempio, label: "Mostra l'etichetta ESEMPIO (toglila quando i numeri sono veri)", widget: boolean, default: true }
          - { name: titolo, label: Titolo della settimana }
          - { name: etichette, label: "Dettagli brevi (es. 8 bambini, Verona, Marzo)", widget: list, field: { name: etichetta, label: Dettaglio } }
          - { name: nota, label: Nota sotto la barra, widget: text, required: false }
          - name: voci
            label: Dove vanno i soldi
            widget: list
            summary: "{{descrizione}} – {{importo}} €"
            fields:
              - { name: descrizione, label: Voce }
              - { name: importo, label: Importo (€), widget: number, value_type: float, min: 0 }

      - name: impostazioni
        label: "⚙️ Impostazioni, contatti, IBAN, PayPal"
        file: content/impostazioni.json
        fields:
          - { name: in_costruzione, label: "Mostra l'avviso \"Il sito è in costruzione\"", widget: boolean, default: true }
          - name: sezioni
            label: "Sezioni pubblicate (per rivederle prima: aggiungi ?anteprima all'indirizzo del sito)"
            widget: object
            fields:
              - { name: chi_siamo, label: Chi siamo, widget: boolean, default: false }
              - { name: come_funziona, label: Come funziona, widget: boolean, default: false }
              - { name: terapie, label: Terapie e terapisti, widget: boolean, default: false }
              - { name: galleria, label: Galleria foto, widget: boolean, default: false }
              - { name: trasparenza, label: Trasparenza, widget: boolean, default: false }
              - { name: sponsor, label: Sponsor, widget: boolean, default: false }
              - { name: shop, label: Shop, widget: boolean, default: false }
              - { name: infermieri, label: Infermieri per le famiglie, widget: boolean, default: false }
              - { name: raccolta, label: Prossima settimana di terapia, widget: boolean, default: false }
              - { name: dona, label: Sostienici (IBAN, PayPal, 5×1000), widget: boolean, default: false }
          - { name: nome, label: Nome associazione }
          - { name: nome_legale, label: Denominazione ufficiale (come sul RUNTS) }
          - { name: titolo_apertura, label: "Titolo di apertura (prima parte)" }
          - { name: titolo_evidenza, label: "Titolo di apertura (parte in corsivo)" }
          - { name: slogan, label: "Testo di apertura (la storia in due righe)", widget: text }
          - { name: email, label: Email, required: false }
          - { name: pec, label: PEC }
          - { name: telefono, label: Telefono, required: false }
          - { name: sede, label: Sede }
          - { name: codice_fiscale, label: Codice fiscale associazione, required: false }
          - { name: runts, label: Dicitura iscrizione RUNTS, required: false }
          - { name: facebook, label: "Link pagina Facebook (vuoto = icona nascosta)", required: false }
          - { name: instagram, label: "Link profilo Instagram (vuoto = icona nascosta)", required: false }
          - { name: iban, label: "IBAN (controlla che sia quello di Progetto Vera!)", required: false }
          - { name: intestatario_iban, label: Intestatario del conto, required: false }
          - { name: causale, label: Causale suggerita }
          - { name: paypal_email, label: "Email del conto PayPal che riceve i pagamenti", required: false }
          - { name: paypal_mensile, label: "Proponi la donazione mensile (serve un conto PayPal Business)", widget: boolean, default: true }
          - { name: cinque_per_mille, label: "Codice fiscale per il 5×1000 (vuoto = nascosto)", required: false }
          - { name: url_area_infermieri, label: "Indirizzo dell'area Infermieri per le famiglie (vuoto = sezione nascosta)", required: false, pattern: ["^(https://script\\.google\\.com/macros/s/[A-Za-z0-9_-]+/exec)?$", "Incolla l'indirizzo che finisce con /exec"] }

      - name: chi-siamo
        label: "👨‍👩‍👧 Chi siamo"
        file: content/chi-siamo.json
        fields:
          - { name: titolo, label: Titolo }
          - { name: storia, label: "La nostra storia (lascia una riga vuota tra i paragrafi)", widget: text }
          - name: numeri
            label: Numeri in evidenza
            widget: list
            fields:
              - { name: valore, label: Numero }
              - { name: etichetta, label: Descrizione }
          - { name: passi_titolo, label: "Titolo di \"Come funziona\"" }
          - name: passi
            label: "Come funziona: i passi, in ordine"
            widget: list
            fields:
              - { name: titolo, label: Titolo }
              - { name: testo, label: Testo, widget: text }
          - name: direttivo
            label: Consiglio direttivo
            widget: list
            fields:
              - { name: nome, label: Nome e cognome }
              - { name: ruolo, label: Ruolo }
          - name: amici
            label: Associazioni amiche
            widget: list
            fields:
              - { name: nome, label: Nome }
              - { name: descrizione, label: Descrizione, widget: text }
              - { name: link, label: Link, required: false }

      - name: terapie
        label: "🩺 Terapie e terapisti"
        file: content/terapie.json
        fields:
          - name: terapie
            label: Terapie
            widget: list
            fields:
              - { name: nome, label: Nome terapia }
              - { name: descrizione, label: Descrizione, widget: text }
              - { name: immagine, label: Immagine, widget: image, required: false }
          - name: terapisti
            label: Terapisti
            widget: list
            fields:
              - { name: nome, label: Nome e cognome }
              - { name: ruolo, label: Ruolo }
              - { name: provenienza, label: Provenienza, required: false }
              - { name: descrizione, label: Presentazione, widget: text }
              - { name: foto, label: Foto, widget: image, required: false }
              - { name: consenso_foto, label: "Ho il consenso scritto a pubblicare la foto", widget: boolean, default: false }
              - { name: link, label: Sito web, required: false }

      - name: galleria
        label: "📷 Galleria foto"
        file: content/galleria.json
        fields:
          - name: foto
            label: Foto
            widget: list
            summary: "{{didascalia}}"
            fields:
              - { name: immagine, label: Foto, widget: image }
              - { name: didascalia, label: "Didascalia (niente diagnosi)", required: false }
              - { name: consenso_scritto, label: "Consenso scritto firmato dai genitori di TUTTI i bambini visibili (senza spunta la foto non viene pubblicata)", widget: boolean, default: false }

      - name: trasparenza
        label: "📊 Trasparenza: entrate e uscite"
        file: content/trasparenza.json
        fields:
          - { name: nota, label: Nota introduttiva, widget: text }
          - name: movimenti
            label: Movimenti
            label_singular: movimento
            widget: list
            summary: "{{data}} · {{tipo}} · {{importo}} € · {{descrizione}}"
            fields:
              - { name: data, label: Data, widget: datetime, format: "YYYY-MM-DD", time_format: false }
              - { name: tipo, label: Tipo, widget: select, options: [ { label: "Entrata (donazione, evento…)", value: entrata }, { label: "Uscita (terapia, attrezzatura…)", value: uscita } ] }
              - { name: descrizione, label: "Descrizione (mai nomi dei bambini: usa codici famiglia)" }
              - { name: importo, label: Importo in euro, widget: number, value_type: float, min: 0 }
              - { name: documento, label: "Ricevuta/fattura (PDF o foto, senza dati sensibili)", widget: file, required: false }

      - name: sponsor
        label: "🤝 Sponsor"
        file: content/sponsor.json
        fields:
          - name: sponsor
            label: Sponsor
            widget: list
            fields:
              - { name: nome, label: Nome }
              - { name: descrizione, label: Descrizione, widget: text, required: false }
              - { name: logo, label: Logo, widget: image, required: false }
              - { name: sito, label: Sito web, required: false }
              - { name: livello, label: Livello, widget: select, options: [oro, argento, bronzo], default: bronzo }

      - name: shop
        label: "🛍️ Shop"
        file: content/shop.json
        fields:
          - { name: nota, label: "Nota (ritiro/spedizione)", widget: text }
          - name: prodotti
            label: Prodotti
            widget: list
            summary: "{{nome}} – {{prezzo}} €"
            fields:
              - { name: nome, label: Nome }
              - { name: descrizione, label: Descrizione, widget: text }
              - { name: prezzo, label: Prezzo in euro, widget: number, value_type: float, min: 0 }
              - { name: immagine, label: Foto, widget: image, required: false }
              - { name: varianti, label: "Varianti separate da virgola (es. S, M, L)", required: false }
              - { name: disponibile, label: Disponibile, widget: boolean, default: true }
